appType: python
standardPorts: true
python:
  version: "3.11"
  requirements: requirements.txt
env:
  BOT_TOKEN: ${BOT_TOKEN}
  ADMIN_IDS: ${ADMIN_IDS}
  MINI_APP_URL: ${MINI_APP_URL}
  DB_PATH: /data/hr_bot.db
  UPLOAD_DIR: /data/uploads
persistentVolumes:
  /data: hr-data
hooks:
  pre-start: python -c "import db; db.init_db()"
startup:
  command: python main.py
